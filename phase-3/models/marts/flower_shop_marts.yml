version: 2

models:
  - name: orders
    description: >
      Enriched order fact table. Joins orders with customer and flower details
      and calculates the monetary value of each order.
    columns:
      - name: order_id
        description: Unique identifier for the order.
        data_tests:
          - unique
          - not_null
      - name: ordered_at
        description: Timestamp when the order was placed.
        data_tests:
          - not_null
      - name: status
        description: Current order status.
        data_tests:
          - not_null
          - accepted_values:
              values: [pending, processing, shipped, delivered]
      - name: is_delivered
        description: True when the order status is delivered.
        data_tests:
          - not_null
      - name: customer_id
        description: Foreign key to the customer who placed the order.
        data_tests:
          - not_null
      - name: customer_name
        description: Full name of the customer.
        data_tests:
          - not_null
      - name: customer_email
        description: Email address of the customer.
        data_tests:
          - not_null
      - name: customer_city
        description: City where the customer is located.
      - name: flower_id
        description: Foreign key to the flower that was ordered.
        data_tests:
          - not_null
      - name: flower_name
        description: Display name of the ordered flower.
        data_tests:
          - not_null
      - name: flower_category
        description: Category of the ordered flower.
        data_tests:
          - not_null
      - name: flower_color
        description: Color of the ordered flower.
        data_tests:
          - not_null
      - name: quantity
        description: Number of stems ordered.
        data_tests:
          - not_null
      - name: price_cents
        description: Unit price of the flower in cents at the time of query.
        data_tests:
          - not_null
      - name: price_dollars
        description: Unit price of the flower in dollars at the time of query.
        data_tests:
          - not_null
      - name: order_total_cents
        description: Total order value in cents (quantity × price_cents).
        data_tests:
          - not_null
      - name: order_total_dollars
        description: Total order value in dollars (quantity × price_dollars).
        data_tests:
          - not_null

  - name: customers
    description: >
      Customer 360 table. Combines customer profile data with aggregated order
      metrics to give a full picture of each customer's relationship with the shop.
    columns:
      - name: customer_id
        description: Unique identifier for the customer.
        data_tests:
          - unique
          - not_null
      - name: full_name
        description: Customer's full name.
        data_tests:
          - not_null
      - name: email
        description: Customer's email address.
        data_tests:
          - not_null
          - unique
      - name: city
        description: City where the customer is located.
      - name: signup_date
        description: Date the customer created their account.
        data_tests:
          - not_null
      - name: total_orders
        description: Total number of orders placed by the customer.
        data_tests:
          - not_null
      - name: total_items_ordered
        description: Total number of flower stems ordered across all orders.
        data_tests:
          - not_null
      - name: total_spend_cents
        description: Lifetime spend in cents.
        data_tests:
          - not_null
      - name: total_spend_dollars
        description: Lifetime spend in dollars.
        data_tests:
          - not_null
      - name: delivered_orders
        description: Number of orders that have been delivered.
        data_tests:
          - not_null
      - name: first_order_at
        description: Timestamp of the customer's first order. Null if no orders placed.
      - name: last_order_at
        description: Timestamp of the customer's most recent order. Null if no orders placed.

  - name: flower_performance
    description: >
      Per-flower sales performance table. Aggregates order data by flower to show
      which products drive the most volume and revenue.
    columns:
      - name: flower_id
        description: Unique identifier for the flower.
        data_tests:
          - unique
          - not_null
      - name: name
        description: Display name of the flower.
        data_tests:
          - not_null
      - name: category
        description: Flower category.
        data_tests:
          - not_null
      - name: color
        description: Primary color of the flower.
        data_tests:
          - not_null
      - name: price_cents
        description: Current unit price in cents.
        data_tests:
          - not_null
      - name: price_dollars
        description: Current unit price in dollars.
        data_tests:
          - not_null
      - name: is_in_stock
        description: Whether the flower is currently available for purchase.
        data_tests:
          - not_null
      - name: total_orders
        description: Number of orders that included this flower.
        data_tests:
          - not_null
      - name: total_units_sold
        description: Total stems sold across all orders.
        data_tests:
          - not_null
      - name: total_revenue_cents
        description: Total revenue generated by this flower in cents.
        data_tests:
          - not_null
      - name: total_revenue_dollars
        description: Total revenue generated by this flower in dollars.
        data_tests:
          - not_null
